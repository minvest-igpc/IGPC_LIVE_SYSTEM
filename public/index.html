<style>
:root{
  --bg:#050B14;
  --panel:#0A121E;
  --panel2:#070D18;
  --border:#1E293B;
  --text:#E2E8F0;
  --muted:#64748B;
  --muted2:#94A3B8;
  --cyan:#00F0FF;
  --green:#00FF9D;
  --gold:#FFC000;
  --red:#FF4B4B;
}

html,body{
  background:var(--bg)!important;
  color:var(--text)!important;
}

body{
  margin:0;
  font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
}

header,
.top-header,
.navbar,
.sidebar,
.panel,
.card,
.module,
.dashboard-panel,
.workspace,
.metric-card,
.modal,
.content-card{
  background:var(--panel)!important;
  border-color:var(--border)!important;
  color:var(--text)!important;
}

h1,h2,h3,h4,h5,
.title,
.heading{
  color:var(--cyan)!important;
}

button,
.nav-link,
.nav-item,
.tab,
.menu-item{
  background:var(--panel2);
  color:var(--muted2);
  border:1px solid var(--border);
  cursor:pointer;
}

button:hover,
.nav-link:hover,
.nav-item:hover,
.tab:hover,
.menu-item:hover{
  color:var(--cyan);
  border-color:var(--cyan);
}

button.active,
.nav-link.active,
.nav-item.active,
.tab.active,
.menu-item.active{
  color:var(--cyan)!important;
  border-color:var(--cyan)!important;
  background:rgba(0,240,255,.06)!important;
}

.status-active,
.validated,
.success,
.online{
  color:var(--green)!important;
}

.warning,
.attention{
  color:var(--gold)!important;
}

.error,
.critical,
.exception{
  color:var(--red)!important;
}

table{
  background:var(--panel2)!important;
  color:var(--text)!important;
  border-color:var(--border)!important;
}

th{
  background:#131F33!important;
  color:var(--cyan)!important;
  border-color:var(--border)!important;
}

td{
  background:var(--panel2)!important;
  color:#CBD5E1!important;
  border-color:var(--border)!important;
}

input,
select,
textarea{
  background:#070D18!important;
  color:var(--text)!important;
  border:1px solid var(--border)!important;
}

input:focus,
select:focus,
textarea:focus{
  outline:none;
  border-color:var(--cyan)!important;
  box-shadow:0 0 8px rgba(0,240,255,.15);
}

.pipeline-btn{
  background:transparent!important;
  color:var(--muted2)!important;
  border-color:var(--border)!important;
}

.pipeline-btn:hover,
.pipeline-btn.active{
  color:var(--cyan)!important;
  border-color:var(--cyan)!important;
  background:rgba(0,240,255,.05)!important;
}

.metric-value,
.value{
  color:var(--cyan)!important;
}

.metric-positive,
.valid{
  color:var(--green)!important;
}

.metric-warning{
  color:var(--gold)!important;
}

.metric-critical{
  color:var(--red)!important;
}

/* ONE IGPC SYSTEM NAVIGATION */

#igpc-main-navigation{
  display:flex;
  gap:8px;
  padding:10px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
}

#igpc-main-navigation button{
  flex:1;
  min-height:42px;
  font-weight:800;
  letter-spacing:.4px;
}

.igpc-module{
  display:none;
  width:100%;
}

.igpc-module.active{
  display:block;
}

/* MODULE FLOW */

#igpc-flow{
  display:flex;
  align-items:center;
  gap:6px;
  padding:10px 0;
  overflow:auto;
}

.igpc-flow-node{
  min-width:150px;
  padding:10px;
  text-align:center;
  background:var(--panel2);
  border:1px solid var(--border);
  color:var(--muted2);
  border-radius:5px;
  cursor:pointer;
  font-size:.7rem;
  font-weight:800;
}

.igpc-flow-node.active{
  color:var(--cyan);
  border-color:var(--cyan);
  background:rgba(0,240,255,.06);
}

.igpc-flow-arrow{
  color:var(--cyan);
  font-weight:900;
}
</style>

<nav id="igpc-main-navigation">

  <button onclick="IGPC.open('virtual-library')">
    VIRTUAL LIBRARY
  </button>

  <button onclick="IGPC.open('project-files')">
    PROJECT FILES
  </button>

  <button onclick="IGPC.open('analytics')">
    ANALYTICS
  </button>

  <button onclick="IGPC.open('diagnostics')">
    DIAGNOSTICS
  </button>

  <button onclick="IGPC.open('reports')">
    REPORTS
  </button>

</nav>

<div id="igpc-flow">

  <div class="igpc-flow-node" onclick="IGPC.open('virtual-library')">
    CLIENT LINK
  </div>

  <div class="igpc-flow-arrow">→</div>

  <div class="igpc-flow-node" onclick="IGPC.open('virtual-library')">
    VIRTUAL LIBRARY
  </div>

  <div class="igpc-flow-arrow">→</div>

  <div class="igpc-flow-node" onclick="IGPC.open('project-files')">
    PROJECT FILES
  </div>

  <div class="igpc-flow-arrow">→</div>

  <div class="igpc-flow-node" onclick="IGPC.open('analytics')">
    ANALYTICS
  </div>

  <div class="igpc-flow-arrow">→</div>

  <div class="igpc-flow-node" onclick="IGPC.open('diagnostics')">
    DIAGNOSTICS
  </div>

  <div class="igpc-flow-arrow">→</div>

  <div class="igpc-flow-node" onclick="IGPC.open('reports')">
    REPORTS
  </div>

</div>

<script>
const IGPC = {

  currentModule: 'project-files',

  open(module){

    this.currentModule = module;

    document.querySelectorAll('.igpc-module')
      .forEach(el => el.classList.remove('active'));

    document.querySelectorAll('#igpc-main-navigation button')
      .forEach(el => el.classList.remove('active'));

    document.querySelectorAll('.igpc-flow-node')
      .forEach(el => el.classList.remove('active'));

    const target =
      document.getElementById('module-' + module);

    if(target){
      target.classList.add('active');
    }

    const nav =
      document.querySelector(
        '#igpc-main-navigation button[onclick*="' +
        module +
        '"]'
      );

    if(nav){
      nav.classList.add('active');
    }

    document.querySelectorAll('.igpc-flow-node')
      .forEach(el => {
        if(
          el.getAttribute('onclick') &&
          el.getAttribute('onclick').includes(module)
        ){
          el.classList.add('active');
        }
      });

    if(module === 'project-files' &&
       typeof renderStep === 'function'){

      renderStep(0);
    }

    if(module === 'analytics' &&
       typeof openAnalytics === 'function'){

      openAnalytics();
    }

    if(module === 'diagnostics' &&
       typeof openDiagnostics === 'function'){

      openDiagnostics();
    }

    if(module === 'reports' &&
       typeof openReports === 'function'){

      openReports();
    }

    if(module === 'virtual-library' &&
       typeof openVirtualLibrary === 'function'){

      openVirtualLibrary();
    }
  }
};

document.addEventListener('DOMContentLoaded',()=>{
  IGPC.open('project-files');
});
</script>
